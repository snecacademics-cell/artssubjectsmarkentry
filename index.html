<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNEC Arts Subject Exam Marks Entry</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="authScreen" class="auth-wrapper">
    <div class="auth-card">
      <h2 style="margin-bottom:0.5rem; color:#1e3c72;">SNEC Portal</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-bottom:1.5rem;">Arts Subject Exam Marks Entry</p>

      <form id="loginForm">
        <div class="input-capsule">
          <input type="text" id="teacherId" placeholder="Teacher ID" required>
        </div>
        <div class="input-capsule">
          <input type="password" id="password" placeholder="Password" required>
          <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
        </div>
        <button type="submit" class="btn-pill interactive">Login</button>
      </form>
      
      <button id="pwaInstallBtn" class="btn-pill interactive" style="display:none; margin-top:10px; background:#4b7bec;">
        <i class="fa-solid fa-download"></i> Install App
      </button>
    </div>
  </div>

  <!-- Dashboard Screen (No Sidebar) -->
  <div id="appContainer" class="app-main-wrapper" style="display:none;">
    
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-title">
        <h2><i class="fa-solid fa-graduation-cap"></i> SNEC Arts Subject Exam Marks Entry</h2>
      </div>
      <div class="header-profile">
        <div class="profile-info">
          <span id="profileName" class="p-name"></span>
          <span id="profileCollege" class="p-college"></span>
        </div>
        <button id="logoutBtn" class="btn-logout interactive">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </header>

    <main class="main-content">
      <!-- Filters Card -->
      <div class="card">
        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
          <div class="input-capsule" style="flex:1; min-width:180px;">
            <select id="classSelect">
              <option value="">Select Class</option>
              <option value="S1">S1 (Class 8)</option>
              <option value="S2">S2 (Class 9)</option>
              <option value="S3">S3 (Class 10)</option>
            </select>
          </div>
          <div class="input-capsule" style="flex:1; min-width:180px;">
            <select id="examSelect">
              <option value="">Select Exam</option>
            </select>
          </div>
          <div class="input-capsule" style="flex:1; min-width:180px;">
            <select id="subjectSelect">
              <option value="">Select Subject</option>
            </select>
          </div>
        </div>

        <div style="display:flex; gap:1rem; margin-top:0.2rem; flex-wrap:wrap;">
          <div class="input-capsule" style="flex:1; min-width:180px;">
            <input type="number" id="maxMarksInput" placeholder="Total Max Marks (e.g. 100)" value="100">
          </div>
          <div class="input-capsule" style="flex:1; min-width:180px;">
            <input type="date" id="examDateInput" title="Exam Date">
          </div>
        </div>
      </div>

      <!-- Student List Table -->
      <div class="card">
        <h3>Students List</h3>
        <div class="table-responsive" style="margin-top:1rem;">
          <table>
            <thead>
              <tr>
                <th style="width: 70px;">Sl. No.</th>
                <th>Students UID</th>
                <th>Name</th>
                <th style="width: 130px;">Marks Obtained</th>
                <th style="width: 110px;">Percentage (%)</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <tr><td colspan="5" style="text-align:center;">Select Class, Exam & Subject to load students</td></tr>
            </tbody>
          </table>
        </div>
        <button id="saveMarksBtn" class="btn-pill interactive" style="margin-top:1rem; background:var(--status-success);">Save Marks Batch</button>
      </div>
    </main>
  </div>

  <!-- Standard Alert Modal -->
  <div id="appModal" class="custom-modal">
    <div class="modal-content">
      <p id="modalMessage" style="margin-bottom:1.5rem; font-size:1rem;"></p>
      <button id="modalCloseBtn" class="btn-pill interactive" style="background:var(--status-info);">OK</button>
    </div>
  </div>

  <!-- Partial Confirmation Modal -->
  <div id="confirmModal" class="custom-modal">
    <div class="modal-content">
      <p id="confirmMessage" style="margin-bottom:1.5rem; font-size:1rem; text-align: left;"></p>
      <div style="display: flex; gap: 10px;">
        <button id="confirmYesBtn" class="btn-pill interactive" style="background:var(--status-success);">Yes, Save Now</button>
        <button id="confirmNoBtn" class="btn-pill interactive" style="background:var(--status-error);">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
